<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishnapriya T. | Contact</title>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    
    <nav class="navbar">
        <div class="logo">KP.</div>
        <ul class="nav-links">
            <li><a href="./port.html#about">About</a></li>
            <li><a href="./port.html#education">Education</a></li>

        </ul>
        <a href="./contact.html" class="contact-btn">Contact Me &rarr;</a>
    </nav>

   
    <section class="contact-section" id="contact">
        <div class="container">
            <h3>Get In Touch</h3>
            <p class="contact-subtext">Have a question or want to work together? Drop me a message!</p>
            
            
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
                </div>
                <button type="submit" class="submit">Send Message</button>
            </form>
        </div>
    </section>

</body>
</html>
